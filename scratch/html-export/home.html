<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #FF6B4A;
        --primary-foreground: #FFFFFF;
        --secondary: #5E5CE6;
        --secondary-foreground: #FFFFFF;
        --muted: #F1F5F9;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #FFFFFF;
        --ring: #FF6B4A;
        --chart-1: #FF6B4A;
        --chart-2: #5E5CE6;
        --chart-3: #F59E0B;
        --chart-4: #10B981;
        --chart-5: #3B82F6;

        --font-sans: "Inter";
        --font-heading: "Outfit";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background font-sans text-foreground pb-24">
      <header class="p-6 pt-12 flex justify-between items-center bg-white sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="relative w-8 h-8 flex items-center justify-center">
            <div
              class="absolute w-5 h-3 bg-gradient-to-r from-orange-400 to-primary rounded-full transform -rotate-45 -translate-y-1 -translate-x-1 shadow-sm"
            ></div>
            <div
              class="absolute w-5 h-3 bg-gradient-to-r from-secondary to-blue-400 rounded-full transform -rotate-45 translate-y-1 translate-x-1 shadow-sm"
            ></div>
          </div>
          <span class="font-heading font-bold text-xl tracking-tight text-foreground"
            >FluentAI</span
          >
        </div>
        <button
          class="w-10 h-10 rounded-full bg-muted flex items-center justify-center relative hover:bg-muted/80 transition-colors"
        >
          <iconify-icon
            icon="solar:bell-bing-bold-duotone"
            class="text-xl text-foreground"
          ></iconify-icon>
          <div
            class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-destructive rounded-full border-2 border-white"
          ></div>
        </button>
      </header>
      <main class="px-6">
        <section class="mb-8 mt-2">
          <p class="text-muted-foreground text-sm font-medium mb-1">Welcome back,</p>
          <h1 class="font-heading text-3xl font-bold text-foreground">Ali Aziz 👋</h1>
        </section>
        <section class="mb-8">
          <div
            class="relative bg-gradient-to-br from-primary/10 via-background to-secondary/10 rounded-3xl p-6 border border-border overflow-hidden shadow-sm"
          >
            <div
              class="absolute -top-10 -right-10 w-32 h-32 bg-primary/20 blur-3xl rounded-full"
            ></div>
            <div
              class="absolute -bottom-10 -left-10 w-32 h-32 bg-secondary/20 blur-3xl rounded-full"
            ></div>
            <div class="relative z-10 flex flex-col items-start">
              <div
                class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/80 backdrop-blur-md rounded-full border border-border shadow-sm mb-4"
              >
                <div class="relative flex h-2 w-2">
                  <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"
                  ></span
                  ><span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                </div>
                <span class="text-xs font-bold text-foreground uppercase tracking-widest"
                  >AI Live Tutor</span
                >
              </div>
              <h2 class="font-heading text-2xl font-bold text-foreground mb-2">
                Speak Natural Spanish
              </h2>
              <p class="text-muted-foreground text-sm mb-6 leading-relaxed max-w-[240px]">
                Jump into a real-time voice conversation with your personal AI tutor.
              </p>
              <button
                class="w-full bg-foreground text-background py-4 px-6 rounded-2xl font-semibold flex items-center justify-center gap-3 shadow-lg shadow-foreground/10 hover:scale-[1.02] active:scale-[0.98] transition-all"
              >
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                  <iconify-icon icon="solar:microphone-3-bold" class="text-xl"></iconify-icon>
                </div>
                Start Conversation
              </button>
            </div>
          </div>
        </section>
        <section class="mb-8 grid grid-cols-2 gap-4">
          <div
            class="bg-card border border-border p-5 rounded-2xl shadow-sm flex flex-col justify-between"
          >
            <div class="flex justify-between items-start mb-3">
              <div
                class="w-10 h-10 rounded-full bg-orange-50 text-primary flex items-center justify-center"
              >
                <iconify-icon icon="solar:fire-bold-duotone" class="text-2xl"></iconify-icon>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                class="text-muted-foreground"
              ></iconify-icon>
            </div>
            <div>
              <h3 class="font-heading font-bold text-2xl text-foreground">12</h3>
              <p class="text-xs text-muted-foreground font-medium mt-0.5">Day Streak</p>
            </div>
          </div>
          <div
            class="bg-card border border-border p-5 rounded-2xl shadow-sm flex flex-col justify-between"
          >
            <div class="flex justify-between items-start mb-3">
              <div
                class="w-10 h-10 rounded-full bg-indigo-50 text-secondary flex items-center justify-center"
              >
                <iconify-icon
                  icon="solar:clock-circle-bold-duotone"
                  class="text-2xl"
                ></iconify-icon>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                class="text-muted-foreground"
              ></iconify-icon>
            </div>
            <div>
              <h3 class="font-heading font-bold text-2xl text-foreground">
                45<span class="text-sm text-muted-foreground font-medium ml-1">min</span>
              </h3>
              <p class="text-xs text-muted-foreground font-medium mt-0.5">Practice Today</p>
            </div>
          </div>
        </section>
        <section>
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-heading text-lg font-bold text-foreground">Up Next</h3>
            <button
              class="text-sm font-semibold text-primary hover:text-primary/80 transition-colors"
            >
              View all
            </button>
          </div>
          <div class="flex flex-col gap-3">
            <div
              class="bg-card border border-border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:border-primary/30 transition-colors cursor-pointer"
            >
              <div
                class="w-14 h-14 rounded-2xl bg-muted flex items-center justify-center shrink-0 text-3xl"
              >
                ☕️
              </div>
              <div class="flex-1">
                <h4 class="font-semibold text-foreground text-sm mb-0.5">Ordering Coffee</h4>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-muted-foreground">Vocabulary</span>
                  <div class="w-1 h-1 rounded-full bg-border"></div>
                  <span class="text-xs text-primary font-medium">5 mins</span>
                </div>
              </div>
              <button
                class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center hover:bg-primary hover:text-white transition-colors"
              >
                <iconify-icon icon="solar:play-bold" class="text-lg translate-x-0.5"></iconify-icon>
              </button>
            </div>
            <div
              class="bg-card border border-border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:border-primary/30 transition-colors cursor-pointer opacity-75"
            >
              <div
                class="w-14 h-14 rounded-2xl bg-muted flex items-center justify-center shrink-0 text-3xl"
              >
                ✈️
              </div>
              <div class="flex-1">
                <h4 class="font-semibold text-foreground text-sm mb-0.5">At the Airport</h4>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-muted-foreground">Grammar</span>
                  <div class="w-1 h-1 rounded-full bg-border"></div>
                  <span class="text-xs text-muted-foreground font-medium">10 mins</span>
                </div>
              </div>
              <button
                class="w-10 h-10 rounded-full bg-muted text-muted-foreground flex items-center justify-center"
              >
                <iconify-icon
                  icon="solar:lock-keyhole-minimalistic-bold"
                  class="text-lg"
                ></iconify-icon>
              </button>
            </div>
          </div>
        </section>
      </main>
      <nav
        class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-border px-6 py-4 pb-8 z-20"
      >
        <div class="flex items-center justify-between max-w-md mx-auto relative">
          <button class="flex flex-col items-center gap-1.5 text-primary flex-1">
            <iconify-icon icon="solar:home-smile-bold" class="text-2xl"></iconify-icon
            ><span class="text-[10px] font-bold">Home</span></button
          ><button
            class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-foreground transition-colors flex-1"
          >
            <iconify-icon icon="solar:book-bookmark-bold-duotone" class="text-2xl"></iconify-icon
            ><span class="text-[10px] font-semibold">Courses</span>
          </button>
          <div class="flex-1 flex justify-center">
            <button
              class="absolute -top-10 flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-primary to-secondary text-white shadow-xl shadow-primary/20 border-4 border-white hover:scale-105 active:scale-95 transition-transform"
            >
              <iconify-icon icon="solar:magic-stick-3-bold" class="text-2xl"></iconify-icon>
            </button>
          </div>
          <button
            class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-foreground transition-colors flex-1"
          >
            <iconify-icon icon="solar:chart-square-bold-duotone" class="text-2xl"></iconify-icon
            ><span class="text-[10px] font-semibold">Stats</span></button
          ><button
            class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-foreground transition-colors flex-1"
          >
            <iconify-icon icon="solar:user-bold-duotone" class="text-2xl"></iconify-icon
            ><span class="text-[10px] font-semibold">Profile</span>
          </button>
        </div>
      </nav>
    </div>
  </body>
</html>
