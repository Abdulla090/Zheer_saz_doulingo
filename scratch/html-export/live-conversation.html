<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveConversation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #FF6B4A;
        --primary-foreground: #FFFFFF;
        --secondary: #5E5CE6;
        --secondary-foreground: #FFFFFF;
        --muted: #F1F5F9;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #FFFFFF;
        --ring: #FF6B4A;
        --chart-1: #FF6B4A;
        --chart-2: #5E5CE6;
        --chart-3: #F59E0B;
        --chart-4: #10B981;
        --chart-5: #3B82F6;

        --font-sans: "Inter";
        --font-heading: "Outfit";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-white font-sans text-foreground flex flex-col">
      <header class="px-6 pt-12 pb-6 flex items-center justify-between">
        <button class="w-10 h-10 rounded-full bg-muted flex items-center justify-center">
          <iconify-icon
            icon="solar:close-circle-bold"
            class="text-2xl text-muted-foreground"
          ></iconify-icon>
        </button>
        <div class="flex flex-col items-center">
          <span class="text-xs font-bold text-muted-foreground uppercase tracking-widest"
            >In Session</span
          ><span class="font-heading font-bold text-lg text-foreground">Spanish Tutor</span>
        </div>
        <div class="w-10 h-10 rounded-full border border-border flex items-center justify-center">
          <span class="text-sm font-bold text-primary">ES</span>
        </div>
      </header>
      <main class="flex-1 flex flex-col items-center justify-center px-6">
        <div class="relative w-48 h-48 flex items-center justify-center mb-12">
          <div class="absolute inset-0 rounded-full bg-primary/10 animate-ping"></div>
          <div class="absolute inset-4 rounded-full bg-secondary/10 animate-pulse"></div>
          <div
            class="relative w-24 h-24 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-xl shadow-primary/20"
          >
            <iconify-icon
              icon="solar:magic-stick-3-bold"
              class="text-4xl text-white"
            ></iconify-icon>
          </div>
          <div class="absolute -bottom-8 flex items-center gap-1.5 h-12">
            <div class="w-1 bg-primary rounded-full animate-[bounce_1s_infinite] h-4"></div>
            <div class="w-1 bg-primary rounded-full animate-[bounce_1.2s_infinite] h-8"></div>
            <div class="w-1 bg-secondary rounded-full animate-[bounce_0.8s_infinite] h-10"></div>
            <div class="w-1 bg-secondary rounded-full animate-[bounce_1.1s_infinite] h-6"></div>
            <div class="w-1 bg-primary rounded-full animate-[bounce_0.9s_infinite] h-9"></div>
          </div>
        </div>
        <div
          class="w-full max-w-sm bg-muted/30 rounded-3xl p-6 border border-border/50 text-center"
        >
          <p class="text-muted-foreground text-sm italic mb-4">AI is speaking...</p>
          <h2 class="font-heading text-xl font-medium text-foreground leading-relaxed">
            "¡Hola Ali! ¿Cómo te gustaría pedir tu café hoy?"
          </h2>
          <p
            class="text-primary text-xs font-medium mt-3 opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-wider"
          >
            Tap for translation
          </p>
        </div>
      </main>
      <footer class="p-8 pb-12 flex flex-col gap-6">
        <div class="flex items-center justify-center gap-6">
          <button
            class="w-14 h-14 rounded-full bg-muted flex items-center justify-center text-foreground hover:bg-muted/80 transition-colors"
          >
            <iconify-icon icon="solar:volume-loud-bold" class="text-2xl"></iconify-icon></button
          ><button
            class="w-20 h-20 rounded-full bg-foreground text-background flex items-center justify-center shadow-2xl shadow-foreground/30 hover:scale-105 active:scale-95 transition-transform"
          >
            <iconify-icon icon="solar:microphone-3-bold" class="text-4xl"></iconify-icon></button
          ><button
            class="w-14 h-14 rounded-full bg-muted flex items-center justify-center text-foreground hover:bg-muted/80 transition-colors"
          >
            <iconify-icon icon="solar:magic-stick-2-bold" class="text-2xl"></iconify-icon>
          </button>
        </div>
        <p class="text-center text-xs text-muted-foreground font-medium">
          Hold to talk or tap for suggestions
        </p>
      </footer>
    </div>
  </body>
</html>
