        .wordmark-wrap {

        .tagline {

        .lead-pet {

        .lead-pet-orange {

        .progress-track {

          background: #ffc800;
          transform-origin: 0 50%;
          will-change: transform;
        }
      </style>

      <div data-hf-id="hf-zsbv" id="root" data-composition-id="02-meet-twino" data-start="0" data-duration="5.5" data-track-index="0" data-width="1920" data-height="1080">
        <div data-hf-id="hf-lj0b" id="frame02-ground" class="clip scene-ground" data-start="0" data-duration="5" data-track-index="1"></div>

        <div data-hf-id="hf-fq42" class="content-stage">
          <div data-hf-id="hf-uvqs" class="micro-grid" aria-hidden="true"></div>

            <div data-hf-id="hf-935g" class="orbit-fragment" data-angle="252" style="--fragment-width: 46px; --fragment-height: 20px; --fragment-color: #3b82f6"></div>

          <img data-hf-id="hf-7fyl" class="lead-pet lead-pet-orange" id="frame02-pet-orange" src="assets/image_021.webp" alt="">
          <img data-hf-id="hf-huvw" class="lead-pet lead-pet-violet" id="frame02-pet-violet" src="assets/image_022.webp" alt="">

          <div data-hf-id="hf-1xti" class="progress-track" aria-hidden="true">

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({ paused: true });
        const frameRoot = document.querySelector('[data-composition-id="02-meet-twino"]');
        const orbitPlane = document.getElementById("frame02-orbit-plane");
        const rings = Array.from(frameRoot.querySelectorAll(".guide-ring"));
        const fragments = Array.from(frameRoot.querySelectorAll(".orbit-fragment"));
        const axis = document.getElementById("frame02-axis");
        const halo = document.getElementById("frame02-halo");
        const eyebrow = document.getElementById("frame02-eyebrow");
        const wordmark = document.getElementById("frame02-wordmark");
        const tagline = document.getElementById("frame02-tagline");
        const orangePet = document.getElementById("frame02-pet-orange");
        const violetPet = document.getElementById("frame02-pet-violet");
        const progress = document.getElementById("frame02-progress");

        // Scene 1 — center-outward guide system. The current mark is intentionally
        // present at t=0; the universe assembles around the fixed product anchor.
        rings.forEach((ring, index) => {
          tl.fromTo(
            ring,
            { scale: 0.22, opacity: 0 },
            {
              scale: 1,
              opacity: 0.82 - index * 0.15,
              duration: 0.82,
              ease: "power3.out",
            },
            index * 0.11,
          );
          tl.to(
            ring,
            {
              scale: 1.04 + index * 0.015,
              opacity: 0.38 - index * 0.06,
              duration: 0.38,
              ease: "power2.inOut",
            },
            0.72 + index * 0.08,
          );
        });

        tl.fromTo(
          progress,
          { scaleX: 0.12 },
          { scaleX: 0.28, duration: 1.05, ease: "power2.out" },
          0,
        );

        // Scene 2 — fragments flip in at their orbital positions, then run a
        // deterministic partial orbit while the guide plane tilts into depth.
        const radiusX = 610;
        const radiusY = 255;
        fragments.forEach((fragment, index) => {
          const initialAngle = (Number(fragment.dataset.angle) / 180) * Math.PI;
          const startX = Math.cos(initialAngle) * radiusX;
          const startY = Math.sin(initialAngle) * radiusY;

          tl.fromTo(
            fragment,
            {
              xPercent: -50,
              yPercent: -50,
              x: startX,
              y: startY,
              rotationX: 68,
              rotationY: -42,
              z: -180,
              scale: 0.34,
              opacity: 0,
            },
            {
              xPercent: -50,
              yPercent: -50,
              x: startX,
              y: startY,
              rotationX: 0,
              rotationY: 0,
              z: 0,
              scale: 1,
              opacity: 0.9,
              duration: 0.48,
              ease: "back.out(1.35)",
            },
            1.1 + index * 0.055,
          );

          const orbitState = { p: 0 };
          tl.to(
            orbitState,
            {
              p: 0.24,
              duration: 1.12,
              ease: "none",
              onUpdate: () => {
                const angle = initialAngle + orbitState.p * Math.PI * 2;
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;
                gsap.set(fragment, { xPercent: -50, yPercent: -50, x, y });
                fragment.style.zIndex = String(1 + Math.round(((y + radiusY) / (radiusY * 2)) * 49));
              },
            },
            1.58 + index * 0.055,
          );
        });

        tl.fromTo(
          halo,
          { scale: 0.84, opacity: 0 },
          { scale: 1.05, opacity: 0.29, duration: 0.92, ease: "power2.out" },
          1.18,
        );
        tl.to(halo, { scale: 1, opacity: 0.21, duration: 0.34, ease: "power2.inOut" }, 2.1);

        tl.fromTo(
          orbitPlane,
          { rotationX: 0, scale: 1, y: 0 },
          { rotationX: 48, scale: 0.96, y: -8, duration: 1.28, ease: "power2.inOut" },
          1.22,
        );
        tl.to(orbitPlane, { rotationX: 24, scale: 0.92, y: -18, duration: 0.46, ease: "power3.out" }, 2.5);
        tl.to(progress, { scaleX: 0.56, duration: 1.7, ease: "power2.inOut" }, 1.1);

        // Scene 3 — orbital matter resolves onto one exact rail, then the name
        // is constructed as a discrete threshold sequence.
        tl.fromTo(axis, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0.64, duration: 0.54, ease: "power3.out" }, 2.8);
        fragments.forEach((fragment, index) => {
          const railX = -560 + index * (1120 / (fragments.length - 1));
          tl.to(
            fragment,
            {
              xPercent: -50,
              yPercent: -50,
              x: railX,
              y: 0,
              rotation: 0,
              opacity: 0.52,
              scale: 0.78,
              duration: 0.58,
              ease: "power3.inOut",
            },
            2.8 + index * 0.018,
          );
        });

        tl.fromTo(
          eyebrow,
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
          2.93,
        );

        const wordStates = [
          { t: 0.0, text: "" },
          { t: 0.08, text: "T" },
          { t: 0.19, text: "TW" },
          { t: 0.31, text: "TWI" },
          { t: 0.44, text: "TWIN" },
          { t: 0.59, text: "TWINO" },
        ];
        const wordAt = (time) => {
          for (let i = wordStates.length - 1; i >= 0; i -= 1) {
            if (time >= wordStates[i].t) return wordStates[i].text;
          }
          return "";
        };
        const wordDriver = { t: 0 };
        tl.to(
          wordDriver,
          {
            t: 0.66,
            duration: 0.66,
            ease: "none",
            onUpdate: () => {
              wordmark.textContent = wordAt(wordDriver.t);
            },
          },
          3.08,
        );
        tl.fromTo(
          wordmark,
          { opacity: 0.74, y: 10 },
          { opacity: 1, y: 0, duration: 0.72, ease: "power2.out" },
          3.08,
        );
        tl.to(progress, { scaleX: 0.82, duration: 1.2, ease: "power2.inOut" }, 2.8);

        // Scene 4 — the lead pair arrives sequentially after the wordmark has
        // fully resolved, framing the lockup without covering the typography.
        // No exit: the characters and identity hold fully still for the cut.
        tl.fromTo(
          orangePet,
          { x: -180, y: 18, scale: 0.96, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
          3.78,
        );
        tl.fromTo(
          violetPet,
          { x: 180, y: 18, scale: 0.96, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
          4.02,
        );
        tl.fromTo(
          tagline,
          { y: 52, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          4.08,
        );
        tl.to(progress, { scaleX: 1, duration: 0.72, ease: "power2.out" }, 4.12);

        window.__timelines["02-meet-twino"] = tl;
      </script>
    </template>
