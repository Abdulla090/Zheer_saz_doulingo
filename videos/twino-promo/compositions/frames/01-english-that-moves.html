        .progress {

          z-index: 8;
        }
      </style>

      <div data-hf-id="hf-3u2l" id="root" data-composition-id="01-english-that-moves" data-start="0" data-duration="5.4" data-width="1920" data-height="1080">
        <div data-hf-id="hf-5lxq" id="frame01-bg-layer" class="clip bg-layer" data-start="0" data-duration="5" data-track-index="0">
          <div data-hf-id="hf-5c3y" class="bg-wedge"></div>
          <div data-hf-id="hf-jvsf" class="dot-grid" aria-hidden="true">
            <span data-hf-id="hf-uckh"></span><span data-hf-id="hf-l73p"></span><span data-hf-id="hf-me0s"></span>
            <span data-hf-id="hf-lzpr"></span><span data-hf-id="hf-n6mu"></span><span data-hf-id="hf-msbt"></span>
            <span data-hf-id="hf-nz8w"></span><span data-hf-id="hf-nkxv"></span><span data-hf-id="hf-ieyi"></span>
          </div>
        </div>

        <div data-hf-id="hf-2f4w" class="route" aria-hidden="true">
          <span data-hf-id="hf-kdkd" class="route-segment route-a"></span>
          <span data-hf-id="hf-oboe" class="route-segment route-b"></span>
          <span data-hf-id="hf-s9sf" class="route-segment route-c"></span>
          <span data-hf-id="hf-v85l" class="route-node"></span>
        </div>

        <div data-hf-id="hf-8nqt" class="victim" id="frame01-victim">
          <div data-hf-id="hf-rk6h" class="eyebrow">
            <span data-hf-id="hf-bj1c" class="eyebrow-mark"></span>
          </div>
          <div data-hf-id="hf-700b" class="lead-wrap">
            <span data-hf-id="hf-xanm" class="lead-text" id="frame01-lead"></span>
          </div>
          <div data-hf-id="hf-akl1" class="ticker-row">
            <div data-hf-id="hf-i9ju" class="ticker-window" data-layout-allow-overflow="">
              <div data-hf-id="hf-x0i1" class="ticker-stack" id="frame01-ticker-stack">
                <div data-hf-id="hf-vheq" class="ticker-item">FITS</div>
                <div data-hf-id="hf-1wp7" class="ticker-item">ADAPTS</div>
                <div data-hf-id="hf-7awm" class="ticker-item">GROWS</div>
              </div>
            </div>
            <div data-hf-id="hf-x5ap" class="with-you">WITH YOU.</div>
          </div>
        </div>

        <svg data-hf-id="hf-p3r6" width="0" height="0" aria-hidden="true" style="position: absolute">
          <defs data-hf-id="hf-mh0t">
            <filter data-hf-id="hf-t053" id="frame01-streak" x="-50%" y="-50%" width="200%" height="200%">
              <fegaussianblur data-hf-id="hf-e92t" id="frame01-streak-blur" in="SourceGraphic" stdDeviation="18 0" />
            </filter>
          </defs>
        </svg>

        <div data-hf-id="hf-mvqp" class="intruder" id="frame01-intruder">
          <div data-hf-id="hf-73sq" class="icon-shell">

          </div>
          <div data-hf-id="hf-2of8" class="impact-copy">
            <div data-hf-id="hf-8bf7" class="impact-kicker">TWINO</div>
            <span data-hf-id="hf-9ecr" class="impact-line">ENGLISH THAT</span>
            <span data-hf-id="hf-fyo2" class="impact-line accented"><span data-hf-id="hf-r7y2" class="accent-word">MOVES</span> WITH YOU.</span>
            <div data-hf-id="hf-74sl" class="final-underline" id="frame01-final-underline"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const frame01Tl = gsap.timeline({ paused: true });
        const frame01Lead = document.getElementById("frame01-lead");
        const frame01Victim = document.getElementById("frame01-victim");
        const frame01Intruder = document.getElementById("frame01-intruder");
        const frame01Ticker = document.getElementById("frame01-ticker-stack");
        const frame01Blur = document.getElementById("frame01-streak-blur");

        const frame01FullText = "ENGLISH THAT";
        const frame01TextDriver = { value: 0 };
        frame01Tl.to(
          frame01TextDriver,
          {
            value: frame01FullText.length,
            duration: 1.08,
            ease: "power1.inOut",
            onUpdate: () => {
              frame01Lead.textContent = frame01FullText.substring(
                0,
                Math.floor(frame01TextDriver.value),
              );
            },
          },
          0.06,
        );

        frame01Tl.fromTo(
          ".eyebrow",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
          0,
        );
        frame01Tl.fromTo(
          ".route-a",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.9, ease: "power2.inOut" },
          0.12,
        );
        frame01Tl.fromTo(
          ".route-b",
          { scaleX: 0 },
          { scaleX: 1, duration: 2.05, ease: "power2.inOut" },
          0.88,
        );

        const frame01TickerSprings = [{ p: 0 }, { p: 0 }];
        const frame01ApplyTicker = () => {
          const total = frame01TickerSprings.reduce((sum, spring) => sum + spring.p, 0);
          frame01Ticker.style.transform = `translateY(${-total * 184}px)`;
        };
        frame01ApplyTicker();
        frame01TickerSprings.forEach((spring, index) => {
          frame01Tl.to(
            spring,
            {
              p: 1,
              duration: 0.56,
              ease: "back.out(1.6)",
              onUpdate: frame01ApplyTicker,
            },
            1.34 + index * 0.55,
          );
        });

        frame01Tl.fromTo(
          ".with-you",
          { opacity: 0, x: 22 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          2.2,
        );

        const frame01Impact = { p: 0 };
        const frame01StageWidth = 1920;
        const frame01VictimFraction = 0.48;
        const frame01PeakBlur = 18;

        const frame01ApplyImpact = () => {
          const p = frame01Impact.p;
          const boundedP = Math.max(0, Math.min(1, p));
          const intruderX = frame01StageWidth * (1 - p);
          const intruderRotation = -8 * (1 - p);
          const intruderOpacity = Math.max(0, Math.min(1, p * 5));
          const victimP = Math.max(0, Math.min(1, p / frame01VictimFraction));
          const victimX = -frame01StageWidth * victimP;
          const blurValue = frame01PeakBlur * (1 - boundedP);

          frame01Intruder.style.transform = `translateX(${intruderX}px) rotate(${intruderRotation}deg)`;
          frame01Intruder.style.opacity = String(intruderOpacity);
          frame01Victim.style.transform = `translateX(${victimX}px)`;
          frame01Victim.style.opacity = String(1 - victimP);
          frame01Blur.setAttribute("stdDeviation", `${blurValue} 0`);
        };

        frame01ApplyImpact();
        frame01Tl.to(
          frame01Impact,
          {
            p: 1,
            duration: 1.12,
            ease: "back.out(1.35)",
            onUpdate: frame01ApplyImpact,
          },
          2.8,
        );

        frame01Tl.fromTo(
          "#frame01-final-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.68, ease: "power2.inOut" },
          4.22,
        );
        frame01Tl.fromTo(
          ".route-c",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.58, ease: "power2.inOut" },
          4.22,
        );
        frame01Tl.fromTo(
          ".route-node",
          { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          4.42,
        );

        window.__timelines["01-english-that-moves"] = frame01Tl;
      </script>
